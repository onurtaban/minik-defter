<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minik Defter</title>
<meta name="description" content="Bebek bakım defteri: beslenme, uyku, bez kaydı, hatırlatıcılar, notlar, aşı takvimi ve büyüme takibi.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#FFF6EF" id="themeColor">
<script>
/* Görünüm: renk paleti ve açık/koyu mod. İlk boyamadan önce uygulanır. */
window.MD_PALETTES = {
  seftali: {ad:"Şeftali", light:{bg:"#FFF6EF",surface2:"#FCEDE3",ink:"#3A2622",muted:"#8A6F68",line:"#F2E2D8",accent:"#C9495C","accent-soft":"#FDE4E6",hero1:"#FFE3D3",hero2:"#FFD3DC"},
            dark:{accent:"#FF8E9B","accent-soft":"#4A2730",hero1:"#3E2722",hero2:"#3E2230"}},
  kayisi:  {ad:"Kayısı ve bal", light:{bg:"#FFF8EE",surface2:"#FBEEDB",ink:"#3B2A1E",muted:"#8A735F",line:"#F2E4D0",accent:"#B85C12","accent-soft":"#FFE9CF",hero1:"#FFEBC8",hero2:"#FFD8B5"},
            dark:{accent:"#FFB066","accent-soft":"#46301A",hero1:"#3F2E1C",hero2:"#3F2619"}},
  adacayi: {ad:"Pudra ve adaçayı", light:{bg:"#FBF6F1",surface2:"#F1EBE3",ink:"#30302B",muted:"#7A776D",line:"#E9E2D8",accent:"#4C7F67","accent-soft":"#E2EFE6",hero1:"#F8E2D9",hero2:"#E1EEDD"},
            dark:{accent:"#8FCDAF","accent-soft":"#24372D",hero1:"#3A2925",hero2:"#24342B"}},
  lavanta: {ad:"Lavanta gün batımı", light:{bg:"#FDF6F3",surface2:"#F5ECEB",ink:"#35283A",muted:"#857487",line:"#EFE2E2",accent:"#7B4BB7","accent-soft":"#EEE4FA",hero1:"#FFE1D5",hero2:"#E8DCFA"},
            dark:{accent:"#C6A6FF","accent-soft":"#352848",hero1:"#3E2824",hero2:"#30253F"}},
  karamel: {ad:"Karamel latte", light:{bg:"#FAF4EC",surface2:"#F1E5D7",ink:"#3A2B22",muted:"#86715F",line:"#EADCCB",accent:"#8E5A2F","accent-soft":"#F3E3D0",hero1:"#F3E1CC",hero2:"#E9D1BA"},
            dark:{accent:"#E3B184","accent-soft":"#453223",hero1:"#3C2C21",hero2:"#36271D"}},
  mercan:  {ad:"Mercan ve krem", light:{bg:"#FFF8F2",surface2:"#FCEEE4",ink:"#3D2620",muted:"#8D6E64",line:"#F4E2D8",accent:"#C8432C","accent-soft":"#FFE3DA",hero1:"#FFDCCF",hero2:"#FFF0D6"},
            dark:{accent:"#FF967F","accent-soft":"#4A2820",hero1:"#43251F",hero2:"#3F301E"}}
};
window.mdApplyTheme = function(){
  var pal = "seftali", mode = "auto";
  try{ pal = localStorage.getItem("minik-defter-palet") || pal; mode = localStorage.getItem("minik-defter-mod") || mode; }catch(e){}
  var P = window.MD_PALETTES[pal] || window.MD_PALETTES.seftali;
  var dark = mode==="dark" || (mode==="auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  var root = document.documentElement;
  root.setAttribute("data-theme", dark ? "dark" : "light");
  var all = ["bg","surface2","ink","muted","line","accent","accent-soft","hero1","hero2"];
  all.forEach(function(k){ root.style.removeProperty("--"+k); });
  var v = dark ? P.dark : P.light;
  Object.keys(v).forEach(function(k){ root.style.setProperty("--"+k, v[k]); });
  var tc = document.getElementById("themeColor"); if(tc) tc.setAttribute("content", dark ? "#1C1513" : P.light.bg);
};
mdApplyTheme();
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){ mdApplyTheme(); }); }catch(e){}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Minik Defter">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: tek sütunlu telefon uygulaması; üstte bebek kartı, altta sabit sekme çubuğu */
:root{
  --bg:#FFF6EF; --surface:#FFFFFF; --surface2:#FCEDE3; --ink:#3A2622; --muted:#8A6F68; --line:#F2E2D8;
  --accent:#C9495C; --accent-ink:#FFFFFF; --accent-soft:#FDE4E6;
  --feed:#C46A1A; --feed-bg:#FFEBD6; --sleep:#7357CC; --sleep-bg:#EFE9FF; --diaper:#2B8067; --diaper-bg:#DCF3EA; --health:#C23D57; --health-bg:#FFE3E8;
  --ok:#2B8067; --warn:#B9761B;
  --hero1:#FFE3D3; --hero2:#FFD3DC; --glass:rgba(255,255,255,.82);
  --shadow:0 1px 2px rgba(90,45,30,.05), 0 8px 24px rgba(90,45,30,.07);
  --f-display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1513; --surface:#2A201E; --surface2:#372B28; --ink:#F8ECE6; --muted:#C2A69E; --line:#43342F;
  --accent:#FF8E9B; --accent-ink:#2B1015; --accent-soft:#4A2730;
  --feed:#F5A960; --feed-bg:#3D2A19; --sleep:#B9A8FF; --sleep-bg:#2F2745; --diaper:#77D2B6; --diaper-bg:#1A3B32; --health:#FF8DA2; --health-bg:#46202A;
  --ok:#77D2B6; --warn:#F0B35A;
  --hero1:#3E2722; --hero2:#3E2230; --glass:rgba(42,32,30,.85);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1513; --surface:#2A201E; --surface2:#372B28; --ink:#F8ECE6; --muted:#C2A69E; --line:#43342F;
  --accent:#FF8E9B; --accent-ink:#2B1015; --accent-soft:#4A2730;
  --feed:#F5A960; --feed-bg:#3D2A19; --sleep:#B9A8FF; --sleep-bg:#2F2745; --diaper:#77D2B6; --diaper-bg:#1A3B32; --health:#FF8DA2; --health-bg:#46202A;
  --ok:#77D2B6; --warn:#F0B35A;
  --hero1:#3E2722; --hero2:#3E2230; --glass:rgba(42,32,30,.85);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 96px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:calc(14px + env(safe-area-inset-top, 0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
h2{font-size:20px} h3{font-size:16px}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Bebek kartı */
#view{display:flex;flex-direction:column;gap:22px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h1{font-size:26px}
.age{font-family:var(--f-display);font-size:15px;color:var(--muted);font-weight:500}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:42px;height:42px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}

.banner{background:var(--surface2);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;flex-wrap:wrap}
.banner b{font-weight:700}

/* Hızlı kayıt */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qbtn{border:0;border-radius:var(--r);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13px}
.qbtn svg{width:26px;height:26px}
.k-feed{background:var(--feed-bg);color:var(--feed)} .k-sleep{background:var(--sleep-bg);color:var(--sleep)}
.k-diaper{background:var(--diaper-bg);color:var(--diaper)} .k-health{background:var(--health-bg);color:var(--health)}
.qbtn.live{outline:2px solid currentColor}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:var(--r);padding:10px 12px;min-width:0}
.stat .v{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.since{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.since-row{display:flex;justify-content:space-between;gap:10px}
.since-row span:last-child{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}

.section{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0}

.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.dot svg{width:18px;height:18px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.due{background:var(--health-bg);color:var(--health)}
.pill.soon{background:var(--feed-bg);color:var(--feed)}
.pill.ok{background:var(--diaper-bg);color:var(--diaper)}
.pill.idle{background:var(--surface2);color:var(--muted)}
.ex{font-size:11px;font-weight:700;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:0 5px;margin-left:6px}
.empty{background:var(--surface);border-radius:var(--r);padding:18px;color:var(--muted);text-align:center;font-size:14px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.mini.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.del{background:none;border:0;color:var(--muted);padding:6px;border-radius:8px}
.del svg{width:18px;height:18px}

.tip{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.tip .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}

/* Filtre çipleri */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daylabel{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-top:4px}

/* Sekme çubuğu */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{background:none;border:0;padding:8px 0 10px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* Sayfa altı form paneli */
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,30,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:88%;overflow:auto;
  padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px}
.sheet .head{display:flex;justify-content:space-between;align-items:center}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.flabel{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:110px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.actions{display:flex;gap:10px}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{border:0;border-radius:14px;padding:18px 10px;font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:72px;justify-content:center}
.pick svg{width:24px;height:24px}
.pick .small{font-weight:600;opacity:.8}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:700;background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--health-bg);color:var(--health)}

/* Grafik */
.chartbox{background:var(--surface);border-radius:var(--r);padding:12px}
.chartbox svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);
  padding:12px 16px;border-radius:12px;font-weight:700;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.alarm{position:fixed;inset:auto 0 0 0;z-index:70;display:flex;justify-content:center;padding:0 max(16px, env(safe-area-inset-right, 0px)) calc(90px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.alarm .box{background:var(--health);color:#fff;border-radius:16px;padding:14px 16px;width:100%;max-width:528px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.alarm .box button{background:#fff;color:#7a1c30;border:0;border-radius:10px;padding:8px 12px;font-weight:700}
.sync{font-size:12px;color:var(--muted);text-align:center}
details.tipd{background:var(--surface);border-radius:var(--r);padding:12px 14px}
details.tipd summary{font-weight:700;cursor:pointer;font-family:var(--f-display);font-size:16px}
details.tipd ul{margin:8px 0 2px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (max-width:360px){.quick{grid-template-columns:repeat(2,1fr)}}
.setup{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.setup .card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;letter-spacing:.12em;font-weight:700;background:var(--surface2);border-radius:10px;padding:10px 12px;text-align:center;user-select:all;overflow-wrap:anywhere}
.errtext{color:var(--health);font-size:13px;font-weight:700}
/* Raporlar */
.rp-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border-radius:var(--r);padding:6px}
.rp-nav .lbl{font-family:var(--f-display);font-weight:700;font-size:16px;text-align:center;flex:1;min-width:0}
.rp-nav button{border:0;background:var(--surface2);border-radius:10px;width:40px;height:36px;font-size:18px;font-weight:700}
.rp-nav button:disabled{opacity:.35}
.unitseg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface2);border-radius:12px;padding:4px}
.unitseg button{border:0;background:none;border-radius:9px;padding:8px 0;font-weight:700;font-size:14px;color:var(--muted)}
.unitseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border-radius:var(--r);padding:12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.tile .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;display:flex;align-items:center;gap:6px}
.tile .l i{width:8px;height:8px;border-radius:2px;display:inline-block}
.tile .v{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .v small{font-size:13px;font-weight:500;color:var(--muted)}
.tile .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chartcard{background:var(--surface);border-radius:var(--r);padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px}
.chartcard h3{font-size:15px}
.chartcard svg{width:100%;height:auto;display:block;overflow:visible}
.tipline{font-size:13px;color:var(--muted);min-height:19px;font-variant-numeric:tabular-nums}
.tipline b{color:var(--ink)}
[data-tip]{cursor:pointer}
.hbar{display:grid;grid-template-columns:minmax(80px,auto) 1fr 34px;gap:8px;align-items:center;font-size:13px}
.hbar .track{height:12px;background:var(--surface2);border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;border-radius:0 4px 4px 0}
.hbar .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.legend2{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend2 span{display:inline-flex;align-items:center;gap:5px}

/* ---------- Modern sıcak tema ---------- */
body{font-size:15.5px;padding-block:0 calc(110px + env(safe-area-inset-bottom, 0px))}
h1,h2,h3{letter-spacing:0;line-height:1.2}
h2{font-size:21px}
#view{gap:24px}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));border-radius:26px;padding:16px 16px 16px 14px;box-shadow:var(--shadow)}
.hero-l{display:flex;gap:14px;align-items:center;min-width:0}
.hero-l > div:last-child{min-width:0}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--accent);flex:none;box-shadow:var(--shadow);padding-top:3px}
.hero h1{font-size:28px}
.age{color:var(--ink);opacity:.72;font-family:var(--f-body);font-weight:600;font-size:14px}
.iconbtn{border:0;background:var(--glass);box-shadow:var(--shadow);width:44px;height:44px}
.sheet .iconbtn{background:var(--surface2);box-shadow:none}
.list,.since,.stat,.tip,.empty,.chartbox,.chartcard,.tile,.rp-nav,details.tipd,.setup .card,.banner{border-radius:var(--r);box-shadow:var(--shadow)}
.banner{background:var(--accent-soft)}
.row{padding:13px 16px}
.dot{border-radius:14px;width:38px;height:38px}
.qbtn,.qbtn.k-feed,.qbtn.k-sleep,.qbtn.k-diaper,.qbtn.k-health{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);border-radius:22px;padding:12px 2px 11px;gap:6px;font-size:13px;font-weight:700}
.qbtn svg{width:48px;height:48px;padding:12px;border-radius:50%;transition:transform .15s}
.qbtn.k-feed svg{background:var(--feed-bg);color:var(--feed)} .qbtn.k-sleep svg{background:var(--sleep-bg);color:var(--sleep)}

const hm = ts => { const d=new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const AYLAR = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const fmtDate = s => { if(!s) return ""; const d = new Date(s+"T12:00"); return d.getDate()+" "+AYLAR[d.getMonth()]+" "+d.getFullYear(); };
const startOfDay = ts => { const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
function dur(ms){ ms=Math.max(0,ms); const m=Math.round(ms/6e4); const h=Math.floor(m/60), mm=m%60; return h? (h+" sa "+(mm? mm+" dk":"")).trim() : mm+" dk"; }
function ago(ts){ const d=Date.now()-ts; return d<6e4? "az önce" : dur(d)+" önce"; }
function dayLabel(ts){ const t=startOfDay(Date.now()), s=startOfDay(ts); if(s===t) return "Bugün"; if(s===t-DAY) return "Dün"; const d=new Date(ts); return d.getDate()+" "+AYLAR[d.getMonth()]; }
function toLocalInput(ts){ const d=new Date(ts); return ymd(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes()); }

/* ---------- Durum ve depolama ---------- */
const LS_KEY = "minik-defter-v1";
const state = { settings:{name:"", birth:"", sex:"k"}, items:new Map(), tab:"home", rp:{unit:"week", anchor:Date.now()}, logFilter:"all", noteFilter:"all", shared:false, loaded:false };

const SB_URL = "https://kbzquokuyrfmweoeyfdp.supabase.co";
const SB_KEY = "sb_publishable_1hXBaii737jcIeyAqIWKjQ_ycaU-iSh";
const FAM_KEY = "minik-defter-aile", OUT_KEY = "minik-defter-bekleyen", SINCE_KEY = "minik-defter-son";
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k, String(v)); }catch(e){} }
let family = lsGet(FAM_KEY);
let outbox = (()=>{ try{ return JSON.parse(lsGet(OUT_KEY)||"[]"); }catch(e){ return []; } })();
let since = Number(lsGet(SINCE_KEY)||0);
let sb = null, chan = null, flushing = false, syncing = false;

function loadLocal(){
  try{ const raw = localStorage.getItem(LS_KEY); if(!raw) return; const o = JSON.parse(raw);
    if(o.settings) state.settings = Object.assign(state.settings, o.settings);
    (o.items||[]).forEach(it => state.items.set(it.id, it));
  }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({settings:state.settings, items:[...state.items.values()]})); }catch(e){}
}
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const el = document.createElement("div"); el.className="toast"; el.textContent=msg; document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}
function client(){
  if(sb) return sb;
  try{ if(window.supabase && window.supabase.createClient) sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:false, autoRefreshToken:false}}); }catch(e){ sb = null; }
  return sb;
}
function queue(op){
  outbox = outbox.filter(o => o.id!==op.id); outbox.push(op); lsSet(OUT_KEY, JSON.stringify(outbox)); flush();
}
async function flush(){
  if(flushing || !family || !client() || !outbox.length) { renderSync(); return; }
  flushing = true; let sent = false;
  try{
    while(outbox.length){
      const o = outbox[0];
      const r = o.op==="put" ? await sb.rpc("md_put", {p_family:family, p_id:o.id, p_data:o.data})
                             : await sb.rpc("md_delete", {p_family:family, p_id:o.id});
      if(r.error) throw r.error;
      outbox.shift(); lsSet(OUT_KEY, JSON.stringify(outbox)); sent = true;
    }
    state.syncErr = false;
  }catch(e){ state.syncErr = true; }
  flushing = false;
  if(sent && chan) { try{ chan.send({type:"broadcast", event:"degisti", payload:{}}); }catch(e){} }
  renderSync();
}
async function sync(){
  if(syncing || !family || !client()) { renderSync(); return; }
  syncing = true;
  try{
    const r = await sb.rpc("md_get", {p_family:family, p_since:since});
    if(r.error) throw r.error;
    let changed = false;
    for(const row of (r.data||[])){
      if(row.ts > since) since = row.ts;
      if(outbox.some(o => o.id===row.id)) continue; // bu cihazdaki gönderilmemiş değişiklik öncelikli
      const d = row.data || {};
      if(d._deleted){ if(state.items.delete(row.id)) changed = true; continue; }
      if(row.id==="settings"){ state.settings = Object.assign({name:"",birth:"",sex:"k"}, d); changed = true; continue; }
      state.items.set(row.id, Object.assign({}, d, {id:row.id})); changed = true;
    }
    lsSet(SINCE_KEY, since); state.syncErr = false; state.loaded = true; state.lastSync = Date.now();
    if(changed){ saveLocal(); if(!$("#sheetBg")) render(); }
  }catch(e){ state.syncErr = true; }
  syncing = false; renderSync();
}

/* ---------- Bebek yaşı ---------- */
function ageParts(){
  const b = state.settings.birth; if(!b) return null;
  const bd = new Date(b+"T00:00"), now = new Date();
  let m = (now.getFullYear()-bd.getFullYear())*12 + now.getMonth()-bd.getMonth();
  let anchor = new Date(bd); anchor.setMonth(bd.getMonth()+m);
  if(anchor>now){ m--; anchor = new Date(bd); anchor.setMonth(bd.getMonth()+m); }
  const days = Math.floor((now-anchor)/DAY);
  return {months:m, days, totalDays:Math.floor((now-bd)/DAY), ageMonthsFloat:(now-bd)/(DAY*30.4375)};
}
function ageText(){
  const a = ageParts(); if(!a) return "Doğum tarihini girmek için sağ üstteki düğmeye dokunun";
  const parts=[]; if(a.months) parts.push(a.months+" aylık"); if(a.days) parts.push(a.days+" günlük"); if(!parts.length) parts.push("Bugün doğdu");
  return parts.join(", ")+" · "+a.totalDays+". gün";
}

/* ---------- Hatırlatıcı mantığı ---------- */
function remDue(r){
  const now = Date.now();
  if(r.mode==="interval"){ const base = r.lastDone || r.t; return base + (Number(r.every)||3)*HOUR; }
  const [h,m] = (r.time||"09:00").split(":").map(Number);
  if(r.mode==="once"){ if(r.lastDone) return null; const d=new Date((r.date||ymd(new Date()))+"T00:00"); d.setHours(h,m,0,0); return d.getTime(); }
  const d = new Date(); d.setHours(h,m,0,0); let c = d.getTime();
  if(r.lastDone && r.lastDone >= c) c += DAY;
  if(!r.lastDone && c < (r.t||0)) c += DAY; // eklendiği andan önceki saat bugün için sayılmaz
  return c;
}
function remStatus(r){
  const due = remDue(r); if(due==null) return {cls:"ok", text:"Tamamlandı", due};
  const diff = due-Date.now();
  if(diff<=0) return {cls:"due", text:"Zamanı geldi", due};
  if(diff<=HOUR) return {cls:"soon", text:dur(diff)+" sonra", due};
  const sameDay = startOfDay(due)===startOfDay(Date.now());
  return {cls:"idle", text:(sameDay?"Bugün ":dayLabel(due)+" ")+hm(due), due};
}
function remDesc(r){
  if(r.mode==="interval") return "Her "+r.every+" saatte bir";
  if(r.mode==="once") return fmtDate(r.date)+" "+r.time+" · tek sefer";
  return "Her gün "+r.time;
}
function markDone(r){ const due = remDue(r)||Date.now(); put(Object.assign({}, r, {lastDone: Math.max(Date.now(), r.mode==="daily"? due : Date.now())})); }

const AYLAR_UZUN = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUNLER = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const COL = {feed:"var(--feed)", sleep:"var(--sleep)", diaper:"var(--diaper)", health:"var(--health)"};
function rpRange(unit, anchor){
  unit = unit||state.rp.unit; const a = new Date(anchor==null? state.rp.anchor : anchor); a.setHours(0,0,0,0);
  let s, e;
  if(unit==="day"){ s = new Date(a); e = new Date(a); e.setDate(e.getDate()+1); }
  else if(unit==="week"){ s = new Date(a); s.setDate(s.getDate()-((s.getDay()+6)%7)); e = new Date(s); e.setDate(e.getDate()+7); }
  else if(unit==="month"){ s = new Date(a.getFullYear(), a.getMonth(), 1); e = new Date(a.getFullYear(), a.getMonth()+1, 1); }
  else { s = new Date(a.getFullYear(), 0, 1); e = new Date(a.getFullYear()+1, 0, 1); }
  return [s.getTime(), e.getTime()];
}
function shiftAnchor(anchor, unit, dir){
  const d = new Date(anchor);
  if(unit==="day") d.setDate(d.getDate()+dir); else if(unit==="week") d.setDate(d.getDate()+7*dir);
  else if(unit==="month"){ d.setDate(1); d.setMonth(d.getMonth()+dir); } else d.setFullYear(d.getFullYear()+dir);
  return d.getTime();
}
function rpShift(dir){ const n = shiftAnchor(state.rp.anchor, state.rp.unit, dir); if(dir>0 && rpRange(state.rp.unit, n)[0] > Date.now()) return; state.rp.anchor = n; }
function rpLabel(){
  const [s,e] = rpRange(), S = new Date(s), E = new Date(e-1), u = state.rp.unit;
  if(u==="day"){ const t = dayLabel(s); return (t==="Bugün"||t==="Dün"? t+", " : GUNLER[S.getDay()]+" ") + S.getDate()+" "+AYLAR[S.getMonth()]; }
  if(u==="week") return S.getDate()+" "+AYLAR[S.getMonth()]+" – "+E.getDate()+" "+AYLAR[E.getMonth()];
  if(u==="month") return AYLAR_UZUN[S.getMonth()]+" "+S.getFullYear();
  return String(S.getFullYear());
}
function dayStats(bs, be, logs){
  const o = {sleep:0, feeds:0, diapers:0, ml:0, wet:0, dirty:0, any:false}, now = Date.now();
  for(const l of logs){
    if(l.kind==="sleep"){ const st = Math.max(l.start, bs), en = Math.min(l.end||now, be); if(en>st){ o.sleep += en-st; o.any = true; } continue; }
    if(l.start<bs || l.start>=be) continue;
    o.any = true;
    if(l.kind==="feed"){ o.feeds++; if((l.sub==="Biberon"||l.sub==="Mama") && l.amount) o.ml += Number(l.amount)||0; }
    else if(l.kind==="diaper"){ o.diapers++; if(/Islak/.test(l.sub||"")) o.wet++; if(/irli/.test(l.sub||"")) o.dirty++; }
  }
  return o;
}
function daysIn(s, e, logs){
  const out = []; let d = new Date(s);
  const rel = logs.filter(l => (l.end||Date.now()) >= s - DAY && l.start < e);
  while(d.getTime() < e){ const n = new Date(d); n.setDate(n.getDate()+1); out.push(Object.assign({s:d.getTime(), e:n.getTime()}, dayStats(d.getTime(), n.getTime(), rel))); d = n; }
  return out;
}
function avgOf(days){
  const act = days.filter(d => d.any), n = act.length || 1, sum = k => act.reduce((a,d)=>a+d[k],0);
  return {n:act.length, sleep:sum("sleep")/n, feeds:sum("feeds")/n, diapers:sum("diapers")/n, ml:sum("ml")/n, wet:sum("wet"), dirty:sum("dirty")};
}
const f1 = v => (Math.round(v*10)/10).toString().replace(".",",");
const fh = ms => f1(ms/HOUR);
function niceStep(max, count){ const raw = max/count, p = Math.pow(10, Math.floor(Math.log10(raw||1))); for(const m of [1,2,2.5,5,10]) if(m*p >= raw) return m*p; return 10*p; }
function barChart(data, color, fmt){
  const W=320, H=160, L=28, R=4, T=8, B=20, n = data.length;
  const max = Math.max(...data.map(d=>d.v), 0);
  const step = niceStep(max||1, 3), top = Math.max(step, Math.ceil((max||1)/step)*step);
  const y = v => T + (1 - v/top)*(H-T-B), bw = (W-L-R)/n, gap = Math.max(2, bw*0.28), w = bw-gap;
  const every = n>16 ? 5 : 1;
  let g = "";
  for(let v=0; v<=top+1e-9; v+=step) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${fmt.axis(v)}</text>`;
  data.forEach((d,i) => {
    const x = L + i*bw + gap/2, h = (H-T-B) - (y(d.v)-T);
    if(d.v>0){ const r = Math.min(4, w/2, h); const yt = y(d.v), yb = H-B;
      g += `<path d="M${x},${yb}V${yt+r}Q${x},${yt} ${x+r},${yt}H${x+w-r}Q${x+w},${yt} ${x+w},${yt+r}V${yb}Z" fill="${color}" opacity="${d.partial?0.55:1}"/>`; }
    if(i%every===0 || n<=16) g += `<text x="${x+w/2}" y="${H-6}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${esc(d.short)}</text>`;
    g += `<rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T}" fill="transparent" data-tip="${esc(d.label+": "+fmt.tip(d.v))}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function chartCard(title, svg, deflt, extra){
  return `<div class="chartcard"><h3>${esc(title)}</h3>${extra||""}${svg}<div class="tipline">${deflt}</div></div>`;
}
function dayTimeline(s, logs){
  const rows = [["sleep","Uyku"],["feed","Beslenme"],["diaper","Bez"],["health","Sağlık"]];
  const W=320, L=60, R=6, RH=28, T=4, H = T + rows.length*RH + 18, e = s + DAY;
  const x = t => L + Math.max(0, Math.min(1, (t-s)/DAY))*(W-L-R);
  let g = "";
  for(let h=0; h<=24; h+=6) g += `<line x1="${x(s+h*HOUR)}" x2="${x(s+h*HOUR)}" y1="${T}" y2="${T+rows.length*RH}" stroke="var(--line)" stroke-width="1"/><text x="${x(s+h*HOUR)}" y="${H-4}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${pad(h)}:00</text>`;
  if(startOfDay(Date.now())===s) g += `<line x1="${x(Date.now())}" x2="${x(Date.now())}" y1="${T}" y2="${T+rows.length*RH}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 3"/>`;
  rows.forEach(([k,l],ri) => {
    const cy = T + ri*RH + RH/2;
    g += `<text x="0" y="${cy+4}" font-size="11" font-weight="700" fill="var(--ink)">${l}</text>`;
    logs.filter(o=>o.kind===k).forEach(o => {
      if(k==="sleep"){ const a = Math.max(o.start,s), b = Math.min(o.end||Date.now(), e); if(b<=a) return;
        g += `<rect x="${x(a)}" y="${cy-7}" width="${Math.max(3, x(b)-x(a))}" height="14" rx="4" fill="${COL.sleep}" data-tip="${esc("Uyku "+hm(o.start)+" – "+(o.end?hm(o.end):"devam ediyor")+" · "+dur((o.end||Date.now())-o.start))}"/>`; }
      else { if(o.start<s||o.start>=e) return;
        g += `<circle cx="${x(o.start)}" cy="${cy}" r="5.5" fill="${COL[k]}" stroke="var(--surface)" stroke-width="2" data-tip="${esc((o.sub||KIND[k].ad)+" · "+hm(o.start)+(o.amount? " · "+o.amount+(k==="health"?" °C":/Emzirme/.test(o.sub||"")?" dk":" ml"):""))}"/>`; }
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Günün zaman çizelgesi">${g}</svg>`;
}
function weekPattern(s, logs){
  const W=320, L=44, R=6, RH=24, T=4, H = T + 7*RH + 18;
  const x = f => L + f*(W-L-R);
  let g = "";
  for(let h=0; h<=24; h+=6) g += `<line x1="${x(h/24)}" x2="${x(h/24)}" y1="${T}" y2="${T+7*RH}" stroke="var(--line)" stroke-width="1"/><text x="${x(h/24)}" y="${H-4}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${pad(h)}</text>`;
  for(let i=0;i<7;i++){
    const d = new Date(s); d.setDate(d.getDate()+i); const ds = d.getTime(), n = new Date(d); n.setDate(n.getDate()+1); const de = n.getTime(), cy = T + i*RH + RH/2;
    g += `<text x="0" y="${cy+4}" font-size="11" font-weight="700" fill="var(--ink)">${GUNLER[d.getDay()]} ${d.getDate()}</text>`;
    logs.forEach(o => {
      if(o.kind==="sleep"){ const a = Math.max(o.start,ds), b = Math.min(o.end||Date.now(), de); if(b<=a) return;
        g += `<rect x="${x((a-ds)/(de-ds))}" y="${cy-8}" width="${Math.max(2, x((b-ds)/(de-ds))-x((a-ds)/(de-ds)))}" height="16" rx="3" fill="${COL.sleep}" data-tip="${esc(GUNLER[d.getDay()]+" "+d.getDate()+" "+AYLAR[d.getMonth()]+" · uyku "+hm(o.start)+" – "+(o.end?hm(o.end):"devam ediyor"))}"/>`; }
      else if(o.kind==="feed" && o.start>=ds && o.start<de){
        g += `<circle cx="${x((o.start-ds)/(de-ds))}" cy="${cy}" r="4" fill="${COL.feed}" stroke="var(--surface)" stroke-width="2" data-tip="${esc(GUNLER[d.getDay()]+" "+d.getDate()+" "+AYLAR[d.getMonth()]+" · "+(o.sub||"Beslenme")+" "+hm(o.start))}"/>`; }
    });
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Haftalık uyku ve beslenme düzeni">${g}</svg>`;
}
function hbars(rows, color){
  const max = Math.max(1, ...rows.map(r=>r[1]));
  return rows.filter(r=>r[1]>0).map(([l,v]) => `<div class="hbar"><span>${esc(l)}</span><div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%;background:${color}"></div></div><span class="n">${v}</span></div>`).join("") || `<div class="small muted">Bu dönemde kayıt yok.</div>`;
}
function feverChart(list){
  const W=320, H=130, L=30, R=8, T=8, B=20;
  const s = list[0].start, e = list[list.length-1].start, span = Math.max(HOUR, e-s);
  const lo = 35.5, hi = Math.max(40, ...list.map(l=>Number(l.amount)+0.3));
  const x = t => L + (list.length===1? 0.5 : (t-s)/span)*(W-L-R), y = v => T + (1-(v-lo)/(hi-lo))*(H-T-B);
  let g = "";
  for(const v of [36,37,38,39,40]) if(v<=hi) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"${v===38?' stroke-dasharray="4 3" stroke="var(--muted)"':""}/><text x="${L-5}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${v}</text>`;
  g += `<path d="${list.map((l,i)=>(i?"L":"M")+x(l.start).toFixed(1)+","+y(Number(l.amount)).toFixed(1)).join("")}" fill="none" stroke="${COL.health}" stroke-width="2"/>`;
  list.forEach(l => g += `<circle cx="${x(l.start)}" cy="${y(Number(l.amount))}" r="4.5" fill="${COL.health}" stroke="var(--surface)" stroke-width="2" data-tip="${esc(dayLabel(l.start)+" "+hm(l.start)+": "+String(l.amount).replace(".",",")+" °C")}"/>`);
  g += `<text x="${W-R}" y="${y(38)-4}" text-anchor="end" font-size="9.5" fill="var(--muted)">38 °C</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ateş ölçümleri">${g}</svg>`;
}
function viewReport(){
  const u = state.rp.unit, [s,e] = rpRange(), logs = all("log");
  const inRange = logs.filter(l => (l.end||l.start||0) >= s && l.start < e);
  const days = daysIn(s, Math.min(e, startOfDay(Date.now())+DAY), logs);
  const cur = avgOf(days);
  const [ps,pe] = rpRange(u, shiftAnchor(state.rp.anchor, u, -1));
  const prev = u==="day"? null : avgOf(daysIn(ps, pe, logs));
  const prevName = {week:"geçen hafta", month:"geçen ay", year:"geçen yıl"}[u];
  const nextDisabled = rpRange(u, shiftAnchor(state.rp.anchor, u, 1))[0] > Date.now();
  const isDay = u==="day";
  const tile = (k, label, val, unit, prevVal) => `<div class="tile"><div class="l"><i style="background:${COL[k]}"></i>${label}</div><div class="v">${val}<small> ${unit}</small></div>${prev && prev.n && cur.n ? `<div class="d">${prevName}: ${prevVal}</div>` : `<div class="d">&nbsp;</div>`}</div>`;
  const per = isDay? "" : "/gün";
  let html = `<section class="section">
    <div class="sec-head"><h2>Raporlar</h2>${isDay||startOfDay(Date.now())>=s&&Date.now()<e ? "" : `<button class="link" data-rtoday="1">Bugüne dön</button>`}</div>
    <div class="unitseg" role="group" aria-label="Dönem">${[["day","Gün"],["week","Hafta"],["month","Ay"],["year","Yıl"]].map(([k,l])=>`<button data-ru="${k}" aria-pressed="${u===k}">${l}</button>`).join("")}</div>
    <div class="rp-nav"><button data-rnav="-1" aria-label="Önceki">‹</button><div class="lbl num">${esc(rpLabel())}</div><button data-rnav="1" aria-label="Sonraki" ${nextDisabled?"disabled":""}>›</button></div>`;
  if(!inRange.length){ return html + `<div class="empty">Bu dönemde kayıt yok. Önceki dönemlere oklarla bakabilirsiniz.</div></section>`; }
  html += `<div class="tiles">
      ${tile("sleep","Uyku", fh(cur.sleep), "sa"+per, prev? fh(prev.sleep)+" sa" : "")}
      ${tile("feed","Beslenme", f1(cur.feeds), isDay?"kez":"kez/gün", prev? f1(prev.feeds) : "")}
      ${tile("diaper","Bez", f1(cur.diapers), isDay?"adet":"adet/gün", prev? f1(prev.diapers) : "")}
      ${tile("feed","Biberon / mama", Math.round(cur.ml), "ml"+per, prev? Math.round(prev.ml)+" ml" : "")}
    </div>
    ${!isDay && cur.n ? `<div class="small muted">Ortalamalar kayıt girilmiş ${cur.n} güne göre hesaplanır.</div>` : ""}`;
  const hint = `Ayrıntı için bir çubuğa veya noktaya dokunun.`;
  if(isDay){
    html += chartCard("Günün akışı", dayTimeline(s, inRange), hint);
  } else {
    let buckets;
    if(u==="year"){
      const Y = new Date(s).getFullYear();
      buckets = AYLAR.map((m,i) => { const bs = new Date(Y,i,1).getTime(), be = new Date(Y,i+1,1).getTime(); const a = avgOf(days.filter(d=>d.s>=bs && d.s<be)); return {short:m, label:AYLAR_UZUN[i]+" (günlük ort.)", a, partial: bs<=Date.now() && Date.now()<be}; });
    } else {
      buckets = days.map(d => { const D = new Date(d.s); return {short: u==="week"? GUNLER[D.getDay()] : String(D.getDate()), label: GUNLER[D.getDay()]+" "+D.getDate()+" "+AYLAR[D.getMonth()], a:d, partial: d.s===startOfDay(Date.now())}; });
      if(u==="week") while(buckets.length<7){ const D = new Date(s); D.setDate(D.getDate()+buckets.length); buckets.push({short:GUNLER[D.getDay()], label:"", a:{sleep:0,feeds:0,diapers:0,ml:0}, future:true}); }
      if(u==="month"){ const D = new Date(s), last = new Date(D.getFullYear(), D.getMonth()+1, 0).getDate(); for(let i=buckets.length+1;i<=last;i++) buckets.push({short:String(i), label:"", a:{sleep:0,feeds:0,diapers:0,ml:0}, future:true}); }
    }
    const mk = (key, div) => buckets.map(b => ({short:b.short, label:b.future? b.short+" (henüz gelmedi)" : b.label, v: (b.a[key]||0)/(div||1), partial:b.partial}));
    const fmtH = {axis: v => String(Math.round(v*10)/10).replace(".",","), tip: v => f1(v)+" sa"};
    const fmtN = {axis: v => String(Math.round(v*10)/10).replace(".",","), tip: v => f1(v)};
    const partialNote = buckets.some(b=>b.partial) ? " Soluk çubuk henüz bitmemiş günü/ayı gösterir." : "";
    html += chartCard("Uyku (saat)", barChart(mk("sleep", HOUR), COL.sleep, fmtH), hint+partialNote);
    if(u==="week") html += chartCard("Uyku ve beslenme düzeni", weekPattern(s, inRange), hint, `<div class="legend2"><span><svg width="16" height="10"><rect width="16" height="10" rx="3" fill="${COL.sleep}"/></svg>Uyku</span><span><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="${COL.feed}"/></svg>Beslenme</span></div>`);
    html += chartCard("Beslenme (kez)", barChart(mk("feeds"), COL.feed, {axis:fmtN.axis, tip:v=>f1(v)+" kez"}), hint);
    if(cur.ml>0) html += chartCard("Biberon ve mama (ml)", barChart(mk("ml"), COL.feed, {axis:v=>String(Math.round(v)), tip:v=>Math.round(v)+" ml"}), hint);
    html += chartCard("Bez (adet)", barChart(mk("diapers"), COL.diaper, {axis:fmtN.axis, tip:v=>f1(v)+" adet"}), hint);
  }
  const feedRows = SUBS.feed.map(([v,l]) => [l, inRange.filter(o=>o.kind==="feed" && o.sub===v && o.start>=s).length]);
  const diaperRows = SUBS.diaper.map(([v,l]) => [l, inRange.filter(o=>o.kind==="diaper" && o.sub===v && o.start>=s).length]);
  html += `<div class="chartcard"><h3>Beslenme türleri</h3>${hbars(feedRows, COL.feed)}</div>`;
  html += `<div class="chartcard"><h3>Bez türleri</h3>${hbars(diaperRows, COL.diaper)}</div>`;
  const fever = inRange.filter(o=>o.kind==="health" && o.sub==="Ateş" && Number(o.amount)>30 && o.start>=s).sort((a,b)=>a.start-b.start);
  if(fever.length) html += chartCard("Ateş ölçümleri (°C)", feverChart(fever), "Kesikli çizgi 38 °C'yi gösterir. "+hint);
  html += `<div class="small muted">Kilo ve boy grafiği Gelişim sekmesinde.</div></section>`;
  return html;
}

  let armed = false;
  $("#leaveFam").onclick = ev => {
    if(outbox.length){ toast("Önce bekleyen değişikliklerin gönderilmesi gerekiyor."); flush(); return; }
    if(!armed){ armed = true; ev.target.textContent = "Emin misiniz? Tekrar dokunun"; return; }
    try{ if(chan) chan.unsubscribe(); }catch(e){} chan = null;
    family = null; lsSet(FAM_KEY, null); lsSet(SINCE_KEY, 0); state.items = new Map(); state.settings = {name:"",birth:"",sex:"k"}; saveLocal(); close(); render();
  };
}

function render(){
  $("#babyName").textContent = state.settings.name || "Bebeğiniz";
  $("#babyAvatar").textContent = (family && state.settings.name ? state.settings.name.trim()[0] : "M").toLocaleUpperCase("tr");
  $("#babyAge").textContent = ageText();
  renderTabs();
  $("nav.tabs").hidden = !family; $("#settingsBtn").hidden = !family;
  if(!family){ $("#babyName").textContent = "Minik Defter"; $("#babyAge").textContent = "Bebek bakım defteri"; $("#view").innerHTML = viewSetup(); renderSync(); return; }
  const v = {home:viewHome, log:viewLog, rem:viewRem, notes:viewNotes, grow:viewGrow, report:viewReport}[state.tab] || viewHome;
  $("#view").innerHTML = v();
  renderSync();
}

/* ---------- Form paneli ---------- */
function openSheet(title, body, onSave, onDelete){
  const layer = $("#layer");
  layer.innerHTML = `<div class="sheet-bg" id="sheetBg"><form class="sheet" id="sheetForm" novalidate>
    <div class="head"><h2>${esc(title)}</h2><button type="button" class="iconbtn" id="sheetX" aria-label="Kapat">${I.x}</button></div>
    ${body}
    <div class="actions">${onDelete?`<button type="button" class="btn danger" id="sheetDel">Sil</button>`:""}<button type="submit" class="btn primary">Kaydet</button></div>
  </form></div>`;
  const close = () => { layer.innerHTML=""; };
  $("#sheetX").onclick = close;
  $("#sheetBg").addEventListener("click", e => { if(e.target.id==="sheetBg") close(); });
  if(onDelete){ let armed=false; $("#sheetDel").onclick = ev => { if(!armed){ armed=true; ev.target.textContent="Silmek için tekrar dokunun"; return; } onDelete(); close(); }; }
  layer.querySelectorAll(".seg").forEach(seg => seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    seg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); seg.dataset.val = b.dataset.v;
    seg.dispatchEvent(new Event("segchange"));
  }));
  $("#sheetForm").addEventListener("submit", e => { e.preventDefault(); if(onSave(new FormData(e.target), layer)!==false) close(); });
}
const seg = (name, opts, val) => `<div class="seg" data-name="${name}" data-val="${esc(val)}">${opts.map(([v,l])=>`<button type="button" data-v="${esc(v)}" aria-pressed="${v===val}">${esc(l)}</button>`).join("")}</div>`;
const segVal = (layer,name) => layer.querySelector(`.seg[data-name="${name}"]`).dataset.val;

const SUBS = {
  feed:[["Emzirme · Sol","Sol göğüs"],["Emzirme · Sağ","Sağ göğüs"],["Biberon","Biberon (anne sütü)"],["Mama","Mama"],["Ek gıda","Ek gıda"]],
  diaper:[["Islak","Islak"],["Kirli","Kirli"],["Islak + kirli","İkisi"]],
  health:[["Ateş","Ateş"],["İlaç","İlaç"],["D vitamini","D vitamini"],["Demir","Demir"],["Banyo","Banyo"],["Diğer","Diğer"]]
};
function nextBreast(){ const lb = all("log").filter(l=>l.kind==="feed"&&/Emzirme/.test(l.sub||"")).sort((a,b)=>b.start-a.start)[0]; return lb && /Sol/.test(lb.sub) ? "Emzirme · Sağ" : "Emzirme · Sol"; }
function amountLabel(kind, sub){ if(kind==="health") return sub==="Ateş"? "Derece (°C)" : null; if(kind==="feed") return /Emzirme/.test(sub)? "Süre (dk)" : sub==="Ek gıda"? null : "Miktar (ml)"; return null; }

function openLog(kind, existing){
  const l = existing || {id:uid(), type:"log", kind, t:Date.now(), start:Date.now()};
  kind = l.kind;
  const subs = SUBS[kind];
  const sub0 = l.sub || (kind==="feed"? nextBreast() : subs? subs[0][0] : "");
  const body = `
    ${subs?`<div class="field"><span class="flabel">Tür</span>${seg("sub", subs, sub0)}</div>`:""}
    <div class="grid2">
      <div class="field"><label for="f-start">${kind==="sleep"?"Uyudu":"Saat"}</label><input id="f-start" name="start" type="datetime-local" value="${toLocalInput(l.start)}"></div>
      ${kind==="sleep"?`<div class="field"><label for="f-end">Uyandı</label><input id="f-end" name="end" type="datetime-local" value="${l.end?toLocalInput(l.end):""}"></div>`
        :`<div class="field" id="amtField"><label for="f-amt" id="amtLabel">Miktar</label><input id="f-amt" name="amount" inputmode="decimal" value="${esc(l.amount||"")}" placeholder="isteğe bağlı"></div>`}
    </div>
    <div class="field"><label for="f-note">Not</label><input id="f-note" name="note" value="${esc(l.note||"")}" placeholder="${kind==="feed"?"ör. havuç püresi, iyi yedi":"isteğe bağlı"}"></div>`;
  openSheet((existing?"Düzenle: ":"")+KIND[kind].ad, body, (fd, layer) => {
    const st = new Date(fd.get("start")).getTime() || Date.now();
    const o = Object.assign({}, l, {start:st, note:(fd.get("note")||"").trim()});
    delete o.ornek;
    if(subs) o.sub = segVal(layer,"sub");
    if(kind==="sleep"){ const e = fd.get("end"); o.end = e? new Date(e).getTime() : null; if(o.end && o.end<o.start){ toast("Uyanma saati uyuma saatinden önce olamaz."); return false; } }
    else o.amount = (fd.get("amount")||"").toString().replace(",",".").trim();
    put(o); toast(KIND[kind].ad+" kaydedildi");
  }, existing? () => remove(l.id) : null);
  const layer = $("#layer");
  const upd = () => { const af = layer.querySelector("#amtField"); if(!af) return; const lab = amountLabel(kind, subs? segVal(layer,"sub") : ""); af.hidden = !lab; if(lab) layer.querySelector("#amtLabel").textContent = lab; };
  const sg = layer.querySelector('.seg[data-name="sub"]'); if(sg) sg.addEventListener("segchange", upd); upd();
}
function quick(kind){
  if(kind==="sleep"){
    const s = all("log").find(l=>l.kind==="sleep"&&!l.end);
    if(s){ put(Object.assign({}, s, {end:Date.now()})); toast("Uyandı · "+dur(Date.now()-s.start)+" uyudu"); }
    else { put({id:uid(), type:"log", kind:"sleep", t:Date.now(), start:Date.now(), end:null}); toast("Uyku başladı, süre tutuluyor"); }
    return;
  }
  quickPick(kind);
}
/* Anında kayıt: türe dokunmak şu anki saatle hemen kaydeder */
function quickPick(kind){
  const subs = SUBS[kind], rec = kind==="feed"? nextBreast() : null;
  const layer = $("#layer");
  layer.innerHTML = `<div class="sheet-bg" id="sheetBg"><div class="sheet">
    <div class="head"><div><h2>${esc(KIND[kind].ad)}</h2><div class="small muted num">Dokunduğunuz an ${hm(Date.now())} saatiyle kaydedilir</div></div><button type="button" class="iconbtn" id="sheetX" aria-label="Kapat">${I.x}</button></div>
    <div class="pickgrid">${subs.map(([v,l])=>`<button type="button" class="pick ${KIND[kind].cls}" data-pick="${esc(v)}">${esc(l)}${v===rec?'<span class="small">sıradaki</span>':""}</button>`).join("")}</div>
    <button type="button" class="btn" id="pickLater">Farklı saat veya ayrıntı girerek ekle</button>
  </div></div>`;
  const close = () => { layer.innerHTML=""; };
  $("#sheetX").onclick = close;
  $("#sheetBg").addEventListener("click", e => { if(e.target.id==="sheetBg") close(); });
  $("#pickLater").onclick = () => { close(); openLog(kind); };
  layer.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    put({id:uid(), type:"log", kind, t:Date.now(), start:Date.now(), sub:b.dataset.pick, note:"", amount:""});
    close(); toast(b.dataset.pick+" · "+hm(Date.now())+" kaydedildi");
  });
}
function chooseKind(){
  const layer = $("#layer");
  layer.innerHTML = `<div class="sheet-bg" id="sheetBg"><div class="sheet">
    <div class="head"><div><h2>Kayıt ekle</h2><div class="small muted">Saatini sonraki ekranda değiştirebilirsiniz</div></div><button type="button" class="iconbtn" id="sheetX" aria-label="Kapat">${I.x}</button></div>
    <div class="pickgrid">${Object.entries(KIND).map(([k,v])=>`<button type="button" class="pick ${v.cls}" data-kind="${k}">${I[k]}${v.ad}</button>`).join("")}</div>
  </div></div>`;
  const close = () => { layer.innerHTML=""; };
  $("#sheetX").onclick = close;
  $("#sheetBg").addEventListener("click", e => { if(e.target.id==="sheetBg") close(); });
  layer.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { close(); openLog(b.dataset.kind); });
}
function openRem(existing, preset){
  const r = existing || Object.assign({id:uid(), type:"rem", t:Date.now(), title:"", mode:"daily", time:"09:00", every:3, date:ymd(new Date()), active:true}, preset||{});
  const body = `
    <div class="field"><label for="r-title">Başlık</label><input id="r-title" name="title" value="${esc(r.title)}" placeholder="ör. D vitamini" required></div>
    <div class="field"><span class="flabel">Tekrar</span>${seg("mode", [["daily","Her gün"],["interval","Saat aralığıyla"],["once","Tek sefer"]], r.mode)}</div>
    <div class="grid2">
      <div class="field" id="r-timeF"><label for="r-time">Saat</label><input id="r-time" name="time" type="time" value="${esc(r.time)}"></div>
      <div class="field" id="r-dateF"><label for="r-date">Tarih</label><input id="r-date" name="date" type="date" value="${esc(r.date)}"></div>
      <div class="field" id="r-everyF"><label for="r-every">Kaç saatte bir</label><input id="r-every" name="every" type="number" min="0.5" step="0.5" value="${esc(r.every)}"></div>
    </div>`;
  openSheet(existing?"Hatırlatıcıyı düzenle":"Yeni hatırlatıcı", body, (fd, layer) => {
    const title = (fd.get("title")||"").trim(); if(!title){ toast("Bir başlık yazın."); return false; }
    const o = Object.assign({}, r, {title, mode:segVal(layer,"mode"), time:fd.get("time")||"09:00", date:fd.get("date")||ymd(new Date()), every:Number(fd.get("every"))||3});
    delete o.ornek;
    if(existing && (o.mode!==r.mode || o.time!==r.time || o.date!==r.date || o.every!==r.every)){ o.lastDone=null; o.t=Date.now(); }
    put(o); toast("Hatırlatıcı kaydedildi"); askNotify();
  }, existing? () => remove(r.id) : null);
  const layer = $("#layer");
  const upd = () => { const m = segVal(layer,"mode"); layer.querySelector("#r-timeF").hidden = m==="interval"; layer.querySelector("#r-dateF").hidden = m!=="once"; layer.querySelector("#r-everyF").hidden = m!=="interval"; };
  layer.querySelector('.seg[data-name="mode"]').addEventListener("segchange", upd); upd();
}
function openNote(existing){
  const n = existing || {id:uid(), type:"note", t:Date.now(), text:"", tag: state.noteFilter!=="all"? state.noteFilter : "genel", pinned:false};
  const body = `
    <div class="field"><span class="flabel">Etiket</span>${seg("tag", Object.entries(NTAGS), n.tag)}</div>
    <div class="field"><label for="n-text">Not</label><textarea id="n-text" name="text" placeholder="ör. Ek gıdaya hangi sebzeyle başlayalım?">${esc(n.text)}</textarea></div>
    <div class="field"><span class="flabel">Üstte sabitle</span>${seg("pin", [["0","Hayır"],["1","Evet"]], n.pinned?"1":"0")}</div>`;
  openSheet(existing?"Notu düzenle":"Yeni not", body, (fd, layer) => {
    const text = (fd.get("text")||"").trim(); if(!text){ toast("Not boş olamaz."); return false; }
    const o = Object.assign({}, n, {text, tag:segVal(layer,"tag"), pinned:segVal(layer,"pin")==="1"}); delete o.ornek;
    put(o); toast("Not kaydedildi");
  }, existing? () => remove(n.id) : null);
}
function openGrow(){
  const body = `
    <div class="field"><label for="g-date">Tarih</label><input id="g-date" name="date" type="date" value="${ymd(new Date())}"></div>
    <div class="grid2">
      <div class="field"><label for="g-kg">Kilo (kg)</label><input id="g-kg" name="kg" inputmode="decimal" placeholder="7,2"></div>
      <div class="field"><label for="g-cm">Boy (cm)</label><input id="g-cm" name="cm" inputmode="decimal" placeholder="65"></div>
      <div class="field"><label for="g-head">Baş çevresi (cm)</label><input id="g-head" name="head" inputmode="decimal" placeholder="42"></div>
    </div>
    <div class="field"><label for="g-note">Not</label><input id="g-note" name="note" placeholder="ör. 5. ay kontrolü"></div>`;
  openSheet("Yeni ölçüm", body, fd => {
    const n = k => { const v = (fd.get(k)||"").toString().replace(",",".").trim(); return v && !isNaN(v) ? Number(v) : null; };
    const o = {id:uid(), type:"grow", t:Date.now(), date:fd.get("date")||ymd(new Date()), kg:n("kg"), cm:n("cm"), head:n("head"), note:(fd.get("note")||"").trim()};
    if(o.kg==null && o.cm==null && o.head==null){ toast("En az bir ölçü girin."); return false; }
    put(o); toast("Ölçüm kaydedildi");
  });
}
function openSettings(){
  const s = state.settings;
  const body = `
    <div class="field"><label for="s-name">Bebeğin adı</label><input id="s-name" name="name" value="${esc(s.name)}" placeholder="ör. Deniz"></div>
    <div class="field"><label for="s-birth">Doğum tarihi</label><input id="s-birth" name="birth" type="date" value="${esc(s.birth)}"></div>
    <div class="field"><span class="flabel">Cinsiyet (büyüme grafiği için)</span>${seg("sex", [["k","Kız"],["e","Erkek"]], s.sex||"k")}</div>
    <button type="button" class="btn" id="lookBtn">Görünüm: renk teması, açık / koyu</button>
    <button type="button" class="btn" id="famBtn">Aile kodu ve diğer telefonu bağlama</button>`;
  openSheet("Bebek bilgileri", body, (fd, layer) => {
    saveSettings({name:(fd.get("name")||"").trim(), birth:fd.get("birth")||"", sex:segVal(layer,"sex")}); toast("Bilgiler kaydedildi");
  });
}

/* ---------- Etkileşimler ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button, [data-editnote]"); if(!b) return;
  const d = b.dataset;
  if(d.tab){ state.tab = d.tab; render(); window.scrollTo(0,0); return; }
  if(d.go){ state.tab = d.go; render(); window.scrollTo(0,0); return; }
  if(d.quick) return quick(d.quick);
  if(d.wake){ const s=state.items.get(d.wake); if(s){ put(Object.assign({}, s, {end:Date.now()})); toast("Uyandı · "+dur(Date.now()-s.start)+" uyudu"); } return; }
  if(d.editlog){ const l=state.items.get(d.editlog); if(l) openLog(l.kind, l); return; }
  if(d.editrem){ const r=state.items.get(d.editrem); if(r) openRem(r); return; }
  if(d.done){ const r=state.items.get(d.done); if(r){ markDone(r); toast("İşaretlendi"); } return; }
  if(d.editnote){ const n=state.items.get(d.editnote); if(n) openNote(n); return; }
  if(d.delgrow){ if(b.dataset.armed){ remove(d.delgrow); } else { b.dataset.armed="1"; b.style.color="var(--health)"; toast("Silmek için tekrar dokunun"); } return; }
  if(d.vax){ const id="vax-"+d.vax, cur=state.items.get(id);
    if(cur && cur.done) remove(id); else put({id, type:"vax", t:Date.now(), done:true, date:ymd(new Date())}); return; }
  if(d.lf){ state.logFilter=d.lf; render(); return; }
  if(d.nf){ state.noteFilter=d.nf; render(); return; }
  if(d.ru){ state.rp.unit=d.ru; render(); return; }
  if(d.rnav){ rpShift(Number(d.rnav)); render(); return; }
  if(d.rtoday){ state.rp.anchor=Date.now(); render(); return; }
  if(d.preset){ const [title,mode,x] = d.preset.split("|"); openRem(null, mode==="interval"? {title,mode,every:Number(x)} : {title,mode,time:x}); return; }
  if(b.id==="vaxPast"){ pastVax().forEach(v => put({id:"vax-"+v.k, type:"vax", t:Date.now(), done:true, date:ymd(vaxDueDate(v))})); toast("Geçmiş aşılar işaretlendi"); return; }
  if(b.id==="addLog") return chooseKind();
  if(b.id==="addRem") return openRem();
  if(b.id==="addNote") return openNote();
  if(b.id==="addGrow") return openGrow();
  if(b.id==="settingsBtn") return openSettings();
  if(b.id==="lookBtn"){ $("#layer").innerHTML=""; return openLook(); }
  if(b.id==="famBtn"){ $("#layer").innerHTML=""; return openFamily(); }
  if(b.id==="clearEx"){ if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent="Emin misiniz? Tekrar dokunun"; return; }
    [...state.items.values()].filter(i=>i.ornek).forEach(i=>remove(i.id)); toast("Örnekler silindi"); return; }
});

/* ---------- Uyarı (uygulama açıkken) ---------- */
const alerted = new Set();
let audioCtx = null;
document.addEventListener("pointerdown", () => { try{ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }, {once:false, passive:true});
function beep(){ try{ if(!audioCtx) return; [0,0.35].forEach(off => { const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination);
  const t=audioCtx.currentTime+off; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3); o.start(t); o.stop(t+0.32); }); }catch(e){} }
function askNotify(){ try{ if("Notification" in window && Notification.permission==="default") Notification.requestPermission().catch(()=>{}); }catch(e){} }
function checkAlarms(){
  if($("#alarm")) return;
  for(const r of all("rem")){
    if(r.active===false) continue;
    const due = remDue(r); if(due==null) continue;
    const key = r.id+"@"+due;
    if(due<=Date.now() && Date.now()-due < 6*HOUR && !alerted.has(key)){
      alerted.add(key); beep();
      try{ if("Notification" in window && Notification.permission==="granted") new Notification("Minik Defter", {body:r.title}); }catch(e){}
      const el = document.createElement("div"); el.className="alarm"; el.id="alarm";
      el.innerHTML = `<div class="box"><div style="flex:1;min-width:0"><div style="font-weight:700">${esc(r.title)}</div><div class="small">Hatırlatıcı · ${hm(due)}</div></div><button id="alDone">Yapıldı</button><button id="alLater">Sonra</button></div>`;
      document.body.appendChild(el);
      el.querySelector("#alDone").onclick = () => { markDone(state.items.get(r.id)||r); el.remove(); };
      el.querySelector("#alLater").onclick = () => el.remove();
      break;
    }
  }
}
setInterval(() => { if(!$("#sheetBg")) render(); checkAlarms(); }, 30000);

/* ---------- Başlat ---------- */
loadLocal(); render();
function boot(){ if(!family) return; connectLive(); flush(); sync(); }
window.addEventListener("load", () => { boot(); checkAlarms(); });
window.addEventListener("online", () => { flush(); sync(); });
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible"){ flush(); sync(); render(); checkAlarms(); } });
setInterval(() => { if(document.visibilityState==="visible"){ flush(); sync(); } }, 60000);
if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
